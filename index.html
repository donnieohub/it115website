<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My First Webpage</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      color: #222;
      margin: 20px;
      padding: 20px;
    }

    h1 {
      color: #0066cc;
    }

    p {

      margin-bottom: 20px;
    }

    form {
      background: white;
      padding: 15px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    label {
      display: block;
      margin-top: 10px;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      box-sizing: border-box;
    }


    button {
      margin-top: 15px;
      padding: 10px 15px;
      background-color: #0066cc;
      color: white;
      border: none;
      border-radius: 5px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: left;
    }

    th {
      background-color: #0066cc;
      color: white;
    }
  </style>
</head>
<body>
  <h1>Welcome to My Page</h1>

  <p>This is a simple HTML page created for my assignment.</p>

  <form>
    <label for="firstName">First Name:</label>
    <input type="text" id="firstName" name="firstName" />

    <label for="lastName">Last Name:</label>
    <input type="text" id="lastName" name="lastName" />


    <label for="email">Email Address:</label>
    <input type="email" id="email" name="email" />

    <button type="submit">Submit</button>
  </form>

  <table>
    <thead>
      <tr>
        <th>Product</th>
        <th>Price</th>
        <th>Quantity</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Notebook</td>
        <td>$3.00</td>

        <td>5</td>
      </tr>
      <tr>
        <td>Pencil</td>
        <td>$1.00</td>
        <td>12</td>
      </tr>
      <tr>
        <td>Eraser</td>
        <td>$0.50</td>
        <td>8</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
